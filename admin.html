<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wood-header">
        <h1>️ Админ-панель</h1>
    </div>

    <div class="admin-container">
        <div class="form-group">
            <label> Дата голосования:</label>
            <input type="date" id="vote-date">
        </div>

        <div class="columns-setup">
            <div class="column-input">
                <label>📝 Левый столбец:</label>
                <input type="text" id="left-option" placeholder="Название опции 1">
            </div>

            <div class="column-input">
                <label>📝 Правый столбец:</label>
                <input type="text" id="right-option" placeholder="Название опции 2">
            </div>
        </div>

        <div class="form-group">
            <label>🔑 Пароль администратора:</label>
            <input type="password" id="admin-password" placeholder="Введите пароль">
        </div>

        <button class="save-btn" onclick="saveSettings()"> Сохранить настройки</button>
        <button class="reset-btn" onclick="resetVotes()"> Сбросить голоса</button>
        
        <div class="export-section">
            <h3>📤 Экспорт для GitHub:</h3>
            <button onclick="exportData()">Скачать data.json</button>
            <p class="hint">Загрузите этот файл в репозиторий для обновления данных</p>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
