<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wood-header">
        <h1>🔐 Админ-панель</h1>
    </div>

    <div class="admin-container">
        <h2 style="margin-bottom: 20px; color: #DEB887;">Добавить новый день</h2>
        
        <div class="form-group">
            <label> Номер дня:</label>
            <input type="number" id="day-number" placeholder="1" min="1">
        </div>

        <div class="columns-setup">
            <div class="column-input">
                <label> Левый круг:</label>
                <input type="text" id="left-option" placeholder="Название">
            </div>

            <div class="column-input">
                <label> Правый круг:</label>
                <input type="text" id="right-option" placeholder="Название">
            </div>
        </div>

        <div class="form-group">
            <label>🔑 Пароль администратора:</label>
            <input type="password" id="admin-password" placeholder="Введите пароль">
        </div>

        <div class="form-group">
            <label>🔐 GitHub Token:</label>
            <input type="password" id="github-token" placeholder="ghp_...">
            <small style="color: #aaa; display: block; margin-top: 5px;">
                Токен сохранится только в твоём браузере
            </small>
        </div>

        <button class="auto-save-btn" onclick="addDay()">➕ Добавить день</button>
        <button class="reset-btn" onclick="finishDay()">🏁 Завершить день</button>
        <button class="save-btn" onclick="uploadToGitHub()"> Загрузить на GitHub</button>
        
        <div id="status" class="status-message"></div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
