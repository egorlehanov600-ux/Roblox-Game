<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }
        .wood-header {
            background: linear-gradient(90deg, #8B4513, #A0522D, #CD853F, #DEB887, #CD853F, #A0522D);
            padding: 30px;
            text-align: center;
            border-bottom: 4px solid #654321;
        }
        .wood-header h1 {
            color: #FFF8DC;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            font-size: 2.5em;
        }
        .main-container {
            display: flex;
            gap: 30px;
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .form-container {
            flex: 1;
            padding: 30px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
        }
        .json-panel {
            flex: 1;
            padding: 30px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            position: sticky;
            top: 20px;
            height: fit-content;
        }
        h2 { color: #DEB887; margin-bottom: 20px; }
        .form-group { margin-bottom: 25px; }
        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 1.2em;
            color: #DEB887;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #8B4513;
            border-radius: 8px;
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 1em;
        }
        .columns-setup {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }
        .column-input label {
            display: block;
            margin-bottom: 10px;
            color: #DEB887;
        }
        .column-input input {
            width: 100%;
            padding: 12px;
            border: 2px solid #8B4513;
            border-radius: 8px;
            background: rgba(0,0,0,0.3);
            color: #fff;
        }
        button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            cursor: pointer;
            color: white;
        }
        .auto-save-btn { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .reset-btn { background: linear-gradient(135deg, #f093fb, #f5576c); }
        .save-btn { background: linear-gradient(135deg, #667eea, #764ba2); }
        .copy-btn { 
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
            font-weight: bold;
        }
        .clear-btn {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            margin-top: 10px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .status-message {
            display: none;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
        }
        .json-display {
            background: rgba(0,0,0,0.5);
            border: 2px solid #8B4513;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            color: #90EE90;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            min-height: 100px;
        }
        .json-label {
            color: #DEB887;
            font-size: 1.2em;
            margin-bottom: 15px;
            display: block;
        }
        .days-list {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }
        .day-item {
            background: rgba(255,255,255,0.1);
            border: 2px solid #8B4513;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }
        .day-item h3 {
            color: #FFD700;
            margin-bottom: 10px;
            font-size: 1.2em;
        }
        .day-item p {
            margin: 5px 0;
            font-size: 0.95em;
        }
        .day-item .status {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 5px;
            font-size: 0.85em;
            font-weight: bold;
            margin-top: 8px;
        }
        .day-item .status.active {
            background: #28a745;
            color: white;
        }
        .day-item .status.finished {
            background: #dc3545;
            color: white;
        }
        .empty-message {
            text-align: center;
            color: #aaa;
            padding: 40px 20px;
            font-style: italic;
        }
        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
            }
            .json-panel {
                position: static;
            }
        }
    </style>
</head>
<body>
    <div class="wood-header">
        <h1>🔐 Админ-панель</h1>
    </div>

    <div class="main-container">
        <div class="form-container">
            <h2>Добавить новый день</h2>
            
            <div class="form-group">
                <label> Номер дня:</label>
                <input type="number" id="day-number" placeholder="1" min="1">
            </div>

            <div class="columns-setup">
                <div class="column-input">
                    <label> Левый круг:</label>
                    <input type="text" id="left-option" placeholder="Название">
                </div>
                <div class="column-input">
                    <label>📝 Правый круг:</label>
                    <input type="text" id="right-option" placeholder="Название">
                </div>
            </div>

            <div class="form-group">
                <label> Пароль администратора:</label>
                <input type="password" id="admin-password" placeholder="Введите пароль">
            </div>

            <div class="form-group">
                <label> GitHub Token:</label>
                <input type="password" id="github-token" placeholder="ghp_...">
                <small style="color: #aaa; display: block; margin-top: 5px;">Токен сохранится только в твоём браузере</small>
            </div>

            <button class="auto-save-btn" onclick="addDay()">➕ Добавить день</button>
            <button class="reset-btn" onclick="finishDay()"> Завершить день</button>
            <button class="save-btn" onclick="uploadToGitHub()">🚀 Загрузить на GitHub</button>
            <button class="clear-btn" onclick="clearAllDays()">🗑️ Очистить все дни</button>
            
            <div id="status" class="status-message"></div>
        </div>

        <div class="json-panel">
            <span class="json-label">📊 Добавленные дни:</span>
            <div id="days-list" class="days-list">
                <div class="empty-message">Пока нет добавленных дней.<br>Добавь первый день!</div>
            </div>
            
            <button class="copy-btn" onclick="copyJSON()">📋 Копировать JSON</button>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
